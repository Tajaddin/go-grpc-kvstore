syntax = "proto3";

package kv.v1;

option go_package = "github.com/Tajaddin/go-grpc-kvstore/gen/kvpb;kvpb";

// KvStore is an in-memory key-value store with TTL and a streaming watch.
service KvStore {
  // Get returns the value for a key, or found=false if absent/expired.
  rpc Get(GetRequest) returns (GetResponse);
  // Set stores a value with an optional TTL (0 = no expiry).
  rpc Set(SetRequest) returns (SetResponse);
  // Delete removes a key. existed reports whether it was present.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // List returns keys matching a prefix (empty prefix = all keys).
  rpc List(ListRequest) returns (ListResponse);
  // Watch streams change events for keys under a prefix until the client
  // cancels the stream.
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message SetRequest {
  string key = 1;
  bytes value = 2;
  // Time-to-live in milliseconds. 0 means no expiry.
  int64 ttl_ms = 3;
}

message SetResponse {
  bool replaced = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool existed = 1;
}

message ListRequest {
  string prefix = 1;
}

message ListResponse {
  repeated string keys = 1;
}

message WatchRequest {
  string prefix = 1;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_SET = 1;
  EVENT_TYPE_DELETE = 2;
  EVENT_TYPE_EXPIRE = 3;
}

message WatchEvent {
  EventType type = 1;
  string key = 2;
  bytes value = 3;
}
